[project]
name = "margin"
version = "0.1.0"
description = "Can a calibrated decision model triage deductive qualitative coding? Harness for the margin paper."
readme = "README.md"
authors = [
    { name = "Rishi Gulati", email = "rg29.work@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13.0",
    "google-genai>=2.29.0",
    "huggingface-hub>=2.2.0",
    "krippendorff>=0.9.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openai>=3.28.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "typer>=0.27.3",
    "typesafe-sdk>=0.7.4",
]

[project.scripts]
margin = "margin.cli:app"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
