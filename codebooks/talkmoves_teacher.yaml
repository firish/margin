name: talkmoves_teacher
version: "1"
dataset: talkmoves
unit: teacher sentence
mode: exclusive
instructions: >-
  Which teacher talk move is this sentence from a K-12 mathematics lesson? Teacher talk moves are
  teacher utterances meant to elicit a student response (regardless of whether they actually do),
  or that repeat, elaborate on, or build off of student contributions.
source: >-
  TalkMoves Coding Manual (Suresh et al., SumnerLab/TalkMoves, CC BY-NC-SA 4.0), sections 1.3-1.6,
  verbatim. Sentences tagged "7 - context" in the data are excluded: the manual does not define it.
codes:
  - id: keeping_together
    label: Keeping Everyone Together
    definition: >-
      Teacher prompts for students to be active listeners are coded as Keeping Everyone Together.
      This code is used for yes/no questions, managing turns, getting students' attention, keeping
      students on task, asking a student to read a question, call-and-response, and asking students
      to repeat each other.
    include:
      - Yes/no questions (that are not related to another student's idea/contribution)
      - Teacher utterances that manage student turns or interactions in a general way
      - Teacher utterances that are intended to keep students' attention
      - Questions intended to keep a student on task
      - Asking a student to read a problem/instructions aloud or to repeat a teacher utterance
      - The teacher prompting a call-and-response utterance
      - Asking the students if they heard or can repeat what another student or teacher said
    examples_pos:
      - So x equals five dollars, right?
      - Go ahead.
      - Can you repeat what you just said?
      - Turn and talk to your partner.
      - Are you finished?
      - Can you read the problem out loud?
      - What did she say?
  - id: relate
    label: Getting Students to Relate
    definition: >-
      Teacher prompts for student contributions that relate to another student's work or
      contribution are coded as Getting Students to Relate. These prompts must go beyond asking a
      student to repeat another student's utterance. This code is used when teachers ask students to
      comment on or to agree/disagree with another's work or ideas.
    include:
      - Asking students to comment or elaborate on other students' contributions
      - >-
        Prompting students to take a position/stance or talk about their own thinking in relation to
        that of another student in the class
    examples_pos:
      - How do you feel about what they said?
      - Would you like to add on to what he said?
      - Does anyone understand how she solved the problem?
      - Do you agree or disagree with him?
      - Who is right?
      - Did anyone else have three?
  - id: restating
    label: Restating
    definition: >-
      The teacher repeating all or part of what a student says word for word, without adding
      anything or changing any of the wording, is coded as Restating.
    examples_pos:
      - "(after S: The same size and shape but it moves to a different position.) It moves to a different position."
      - "(after S: An exponent) Exponent."
      - "(after S: It's four million and then the two.) Four million two."
  - id: press_accuracy
    label: Pressing for Accuracy
    definition: >-
      Teacher prompts for an answer related to a mathematical procedure or for a short math-related
      answer are coded as Pressing for Accuracy. The teacher may be prompting students to walk
      through problem-solving procedures, consider language accuracy, or define elements of a
      problem. This code also may be applied when the teacher asks students to write their answers
      at the board in front of the class.
    include:
      - The teacher requesting an answer to a problem
      - Prompting a student to talk through a problem-solving procedure or possible variations on a problem
      - Prompting for an answer related to language precision
      - The teacher asking a student to define elements in an equation
    examples_pos:
      - What is the answer to number 2?
      - What is 6 times 6?
      - Can you write your answer on the board?
      - How did you solve it?
      - What is this called?
      - What does x stand for?
  - id: revoicing
    label: Revoicing
    definition: >-
      The teacher repeating what a student says AND adding on to or changing the wording in any way
      is coded as Revoicing. This includes when the teacher is correcting a student and when a
      teacher repeats a student's utterance in another language.
    examples_pos:
      - "(after S: It had two.) So instead of one flat edge, it had two."
      - "(after S: An exponent.) The exponent."
      - "(after S: Oh, Company B.) It's Company B because that's the one that charges you $2.00 per minute."
      - "(after S: I got 2X minus Y.) It's not 2X."
  - id: press_reasoning
    label: Pressing for Reasoning
    definition: >-
      Teacher prompts for students to provide evidence, explain their idea, or share their thinking
      behind a decision are coded as Press for Reasoning. The teacher may also be prompting for
      students to connect concepts or compare mathematical representations.
    include:
      - Teacher prompts students to explain their ideas
      - Teacher asks a student to connect two or more ideas or explain how a concept is related to the problem
      - Teacher prompts students to compare across mathematical representations
    examples_pos:
      - Can you explain why?
      - How did you know?
      - Why does this method work?
      - How are these ideas connected?
      - How would that equation look on a graph?
none_option:
  id: none
  label: None
  definition: The sentence is not one of the teacher talk moves above (what is not coded).
  include:
    - Teacher utterances that neither ask for a student contribution nor repeat all or part of a student contribution.
    - Teacher utterances that are not related to the lesson (such as talking to students before or after a lesson).
    - Teacher utterances that are not understandable (i.e., an important part of the transcript is blank).
    - Teacher questions like "Okay?" or "Right?" if that is the complete utterance.
    - Evaluative statements like "That's interesting," or "Good."
    - Teacher utterances that seem like a talk move but do not fit into any of our categories.
    - Teacher utterances explaining a concept generally or stating goals or objectives.
    - Teacher utterances asking students to write something on their own paper.
    - Teacher utterances addressing another teacher.
    - Teacher questions that have no bearing on the math, e.g. "What should we call this street?"
