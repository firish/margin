scholar:
- Use this code when Du Bois is portrayed as a scholar or intellectual, particularly with regard to Black
  politics, racial identity, or social theory. If Du Bois is brought up through his social-theory ideas,
  code him as a scholar rather than an activist, except where the passage involves a call to action, his
  organizing, or some other political activity that is not scholarly. Do not use it when Du Bois is merely
  the subject within historical and academic study, or when his scholarship is only suggested through
  loose links to other scholars.
- Do not apply this code if Du Bois is just the topic of historical and academic study, or if his scholarship
  is only hinted at through loose associations with other scholars. Apply it when Du Bois is described
  as a scholar or intellectual, especially concerning Black politics, racial identity, or social theory.
  Where his social-theory ideas are what is invoked, classify him as a scholar and not an activist, unless
  the passage contains a call to action, refers to his organizing, or describes other non-scholarly political
  activity.
activist:
- 'Use this code if Du Bois is explicitly labeled an "activist" or "leader", or if his political or social
  activism is stated outright or clearly implied by context. Examples: references to leadership, activism,
  building activist organizations, delivering public speeches, meeting with politicians and organizers,
  running for office, or backing a candidate, organization, or initiative.'
- Context in which Du Bois is mentioned as leading, doing activism, developing activist organizations,
  giving public speeches, meeting with politicians and organizers, running for office, or promoting a
  candidate, organization, or initiative qualifies for this code. It also applies whenever he is explicitly
  named an "activist" or "leader", or when his political or social activism is explicitly noted or clearly
  implied by the context.
monumental_memorialization:
- Use this code when a lasting cultural object bears Du Bois's name. Such objects include prizes or awards,
  named professorships, buildings or rooms, geographical features, institutes, schools, or activist organizations.
  Do not use it when Du Bois's name only appears in the title of a book or theater production.
- A book or theater production with Du Bois in its title does not qualify for this code. It applies when
  an enduring cultural object is named for Du Bois, whether a prize/award, named professorship, building
  or room, geographical feature, institute, school, or activist organization.
scholarly_work:
- Use this code when W.E.B. Du Bois's academic works or major theoretical concepts are mentioned or quoted,
  including explicit naming or direct quotation of his writings and references to his key academic ideas,
  even when unnamed, so long as they are clearly attributed to him. A quotation counts only if it comes
  from a scholarly work; rely on context to judge whether it is from scholarship, such as history or social
  theory, versus another kind of text, such as a letter or speech. Do not use it for general references
  to Du Bois's influence, body of writings, or activities outside his scholarly work. Do not use it when
  others' work is discussed, unless Du Bois's scholarly concepts or writings are explicitly and centrally
  mentioned.
- 'This code is not for general references to Du Bois''s influence, his body of writings, or activities
  beyond his scholarly work, nor for discussion of others'' work unless Du Bois''s scholarly concepts
  or writings are explicitly and centrally mentioned. It is for passages that mention or quote academic
  works or major theoretical concepts by W.E.B. Du Bois: explicit naming or direct quotes of his writings,
  or references to his key academic ideas (even unnamed) clearly attributed to him. A quote qualifies
  only if it is from a scholarly work, which context should reveal (e.g., a history or social theory versus
  a letter or speech).'
advocacy:
- Use this code when a passage mentions or implies any kind of social or political activism, advocacy,
  critique, or discourse, including talk of current or historical social problems. This covers direct
  activism by Du Bois and others as well as the framing and challenging of social norms, historical narratives,
  and racial or cultural identities. Use it as well when Du Bois's work, persona, or ideas are called
  upon in discussions that critically engage with Black identity, positionality, or the wider systemic
  circumstances of Black people. Merely being next to other activists, such as appearing in a list, is
  not enough; advocacy must be explicitly mentioned in the passage.
- Advocacy must be explicitly mentioned in the passage; appearing alongside other activists, as in a list,
  does not suffice. Beyond that, this code fits any passage that mentions or implies social or political
  activism, advocacy, critique, or discourse, including about current or historical social problems, whether
  direct activism by Du Bois and others or the framing and challenging of social norms, historical narratives,
  and racial or cultural identities. It also fits invocations of Du Bois's work, persona, or ideas within
  discussions critically engaging with Black identity, positionality, or broader systemic circumstances
  of Black people.
coalition_building:
- Du Bois is depicted as an agent who establishes his reputation by means of organizational and institutional
  sponsorship.
- Use this code when Du Bois is portrayed as an agent whose reputation is established through sponsorship
  from organizations and institutions.
mouth_of_academics:
- Use this code when a specific member of an academic organization engages with Du Bois's work, or with
  Du Bois as representing a concept. Use it too when an activist organization has named itself, or a subdivision
  of itself such as an institute or named professorship, after Du Bois. Describing Du Bois as a member
  of an academic organization is not enough. The code captures a member of an academic organization discussing
  Du Bois; it is not enough to presume that the entity discussing or promoting Du Bois is academic.
- This code captures a member of an academic organization discussing Du Bois, either engaging with his
  work or with him as representing a concept. It also applies where an activist organization has named
  itself or a subdivision (such as an institute or named professorship) after Du Bois. It does not apply
  merely because Du Bois is described as belonging to an academic organization, nor may you presume that
  whoever discusses or promotes Du Bois is academic.
mouth_of_activists:
- Use this code when someone described as a leader, activist, or politician, or as a member of a specific
  political or activist organization (e.g., political parties, the NAACP, the Black church, Black Lives
  Matter), references or draws on W.E.B. Du Bois's work or legacy. This includes cases where the person's
  role as leader, activist, or politician is implied by their actions or affiliations, even if not stated.
  It also applies when governments, political parties, or activist organizations tie their agenda to Du
  Bois, such as by commemorating him through initiatives (like foundations or prizes) named after him.
  Do not use it when Du Bois is mentioned as a member of an organization, unless a representative of that
  organization cites his membership to link their agenda to him.
- Where Du Bois is simply mentioned as an organization's member, do not apply this code, unless an organization's
  representative cites that membership to connect their agenda to him. Otherwise, apply it when a leader,
  activist, politician, or member of a specific political or activist organization (e.g., political parties,
  the NAACP, the Black church, Black Lives Matter) references or draws on W.E.B. Du Bois's work or legacy,
  including where their role as leader, activist, or politician is implied through actions or affiliations
  though not explicitly stated. It further covers governments, political parties, or activist organizations
  linking their agenda to Du Bois, for instance by commemorating him via initiatives (like foundations
  or prizes) named after him.
collective_synecdoche:
- 'Du Bois is named together with other famous intellectuals, activists, or public figures so as to stand
  for some aspect of a culture, era, or ideology. Examples: standing for race scholarship, civil rights
  activism, left political leaders, Black excellence, and 20th century political commentators.'
- Use this code when Du Bois is grouped with other famous intellectuals, activists, or public figures
  in order to represent a facet of a culture, era, or ideology, such as race scholarship, civil rights
  activism, left political leaders, Black excellence, or 20th century political commentators.
