care:
- Gut-level concerns about keeping others from suffering emotional or physical damage or harm. It supports
  the virtues of kindness, gentleness, and nurturing, and the vices of meanness, violence, and abuse.
- The virtues of kindness, gentleness, and nurturing, and the vices of meanness, violence, and abuse,
  rest on intuitions about not inflicting emotional or physical damage or harm on others.
equality:
- Gut-level concerns that all individuals and groups be treated in an egalitarian way and receive equal
  outcomes.
- Intuitions favoring equal outcomes for every individual and group, and egalitarian treatment of them.
proportionality:
- Gut-level concerns that individuals be rewarded according to their merit, meaning their effort, talent,
  or input.
- Intuitions that the reward an individual receives should match their merit (effort, talent, or input).
loyalty:
- Gut-level concerns about cooperating within the in-group and competing against out-groups. It supports
  the virtues of patriotism and self-sacrifice for the group.
- The virtues of patriotism and self-sacrifice for the group rest on intuitions about in-group cooperation
  and out-group competition.
authority:
- Gut-level concerns about showing deference to legitimate authorities and high-status individuals. It
  supports the virtues of leadership and respect for tradition.
- The virtues of leadership and respect for tradition rest on intuitions about deferring to legitimate
  authorities and high-status individuals.
purity:
- Gut-level concerns about steering clear of bodily and spiritual contamination and degradation. It supports
  the virtues of sanctity, nobility, and cleanliness.
- The virtues of sanctity, nobility, and cleanliness rest on intuitions about avoiding bodily and spiritual
  contamination and degradation.
thin_morality:
- A moral judgment or concern that is expressed without clearly pointing to any one of the six moral domains.
- Voicing a moral judgment or concern while not clearly referring to any of the six moral domains.
non_moral:
- The comment contains no moral sentiment.
- No moral sentiment is present in the comment.
